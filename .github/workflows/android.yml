# Builds an installable Android app (APK) for every push and publishes it
# as the "android-latest" pre-release, so it can be downloaded on the phone.
name: Android APK

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub runner already has the Android SDK (ANDROID_HOME); add the NDK version we build with.
      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --apk --target aarch64

      # Android only installs an update if it is signed with the same key as the
      # installed app. For test builds the key is created once on GitHub and kept
      # in the Actions cache (never in the repository). Store releases will use
      # the ANDROID_KEYSTORE_* secrets instead.
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: .signing
          key: android-test-signing-key-v1

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS=release.jks; PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            mkdir -p .signing
            if [ ! -f .signing/test.jks ]; then
              openssl rand -hex 24 > .signing/password
              keytool -genkeypair -keystore .signing/test.jks -alias test -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$(cat .signing/password)" -dname "CN=StudioCable Test Build"
            fi
            KS=.signing/test.jks; PASS="$(cat .signing/password)"; ALIAS=test
          fi
          export PASS
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-pass env:PASS --ks-key-alias "$ALIAS" --out StudioCable.apk aligned.apk
          "$BT/apksigner" verify StudioCable.apk
          ls -la StudioCable.apk
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: StudioCable-android
          path: StudioCable.apk

      - name: Publish as "android-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Latest test build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7}). Open this page on your Android phone, tap StudioCable.apk and install it."
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest StudioCable.apk --prerelease --target "$GITHUB_SHA" \
            --title "StudioCable for Android (test build)" --notes "$NOTES"
