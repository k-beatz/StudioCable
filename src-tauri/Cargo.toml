[package]
name = "studiocable"
version = "0.1.0"
description = "CableBrain – plan and document studio wiring"
authors = ["CableBrain"]
license = ""
repository = "https://github.com/k-beatz/StudioCable"
edition = "2021"
rust-version = "1.77"

[lib]
# The "_lib" suffix avoids a name clash with the binary on Windows.
name = "studiocable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
# Small, fast binaries: the Rust side is only a thin shell around the web UI.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
